name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/Tumanza
            git pull origin main
            npm install
            npm run build
            chown -R tumanza:tumanza /var/www/Tumanza/.next
            # App must run under the tumanza user PM2 (systemd: pm2-tumanza.service).
            # Never start a second copy under root's PM2 — that steals/conflicts on :3000.
            su -s /bin/bash tumanza -c 'cd /var/www/Tumanza && pm2 restart tumanza || pm2 start ecosystem.config.cjs'
            su -s /bin/bash tumanza -c 'pm2 save'
